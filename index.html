<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Page</title>

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(to right, #ff6a00, #ee0979);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .login-box {
      background: white;
      padding: 40px;
      width: 350px;
      border-radius: 20px;
      box-shadow: 0px 8px 20px rgba(0, 0, 0, 0.3);
      text-align: center;
    }

    .login-box h2 {
      font-size: 28px;
      color: #ee0979;
      margin-bottom: 20px;
    }

    .input-box {
      margin: 15px 0;
    }

    .input-box input {
      width: 100%;
      padding: 12px;
      border: 2px solid #ff6a00;
      border-radius: 10px;
      outline: none;
      font-size: 16px;
    }

    .input-box input:focus {
      border-color: #ee0979;
    }

    .login-btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 10px;
      background: #ee0979;
      color: white;
      font-size: 18px;
      cursor: pointer;
      margin-top: 15px;
      transition: 0.3s;
    }

    .login-btn:hover {
      background: #ff6a00;
    }

    .footer-text {
      margin-top: 20px;
      font-size: 14px;
      color: gray;
    }

    .footer-text a {
      text-decoration: none;
      color: #ee0979;
      font-weight: bold;
    }
  </style>

</head>
<body>

  <div class="login-box">
    <h2>Login Here</h2>

    <div class="input-box">
      <input type="text" placeholder="Enter Username">
    </div>

    <div class="input-box">
      <input type="password" placeholder="Enter Password">
    </div>

    <button class="login-btn">Login</button>

    <p class="footer-text">
      Don't have an account? <a href="#">Sign Up</a>
    </p>
  </div>

</body>
</html>
